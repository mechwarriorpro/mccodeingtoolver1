name: Build Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    # A real Windows runner is what lets electron-builder download the Electron
    # binary and produce the NSIS .exe, which cannot be done on a network-restricted box.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # Plain `npm ci`: electron's postinstall downloads the runtime that both the
        # dev server and electron-builder need. (electron-builder also caches its own
        # copy, so this step is the only download.)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          CI: 'true'

      # Annotations and the step summary are readable through the API even when
      # artifact/log downloads are blocked by a proxy, so echo failures here too.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          if [ -f test-failures.json ]; then
            node -e '
              const fs = require("fs");
              const f = JSON.parse(fs.readFileSync("test-failures.json", "utf8"));
              for (const x of f) {
                const msg = String(x.detail || "").replace(/%/g, "%25").replace(/\r?\n/g, " ").slice(0, 400);
                const title = `${x.file} :: ${msg}`.replace(/[:-]/g, " ").slice(0, 240);
                console.log(`::error title=${title}::${msg}`);
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### Test failures\n" + f.map(x => `- **${x.file}**: ${x.detail}`).join("\n"));
            '
          else
            echo "::error title=tests::npm test failed before writing test-failures.json"
          fi

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            test-failures.json
            out-test/**/*.js
          if-no-files-found: ignore
          retention-days: 7

      - name: Package installer
        shell: pwsh
        run: |
          npx electron-builder --win --publish never 2>&1 | Tee-Object -FilePath eb.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content eb.log -Tail 25) -join ' | '
            $tail = $tail -replace '%','%25'
            Write-Host "::error title=electron-builder::$(($tail.Substring(0, [Math]::Min(800, $tail.Length))))"
            exit $code
          }
        env:
          # No code-signing certificate; produce an unsigned installer.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: Get-ChildItem release | Format-Table Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC-Forge-Agent-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
